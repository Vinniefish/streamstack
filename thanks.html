<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks — Plex Integrator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0f0f10;--panel:#161617;--text:#f5f6f7;--muted:#b7bcc2;--brand:#e5a00d;--stroke:#262628;}
    *{box-sizing:border-box;} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .wrap{min-height:100dvh;display:grid;place-items:center;padding:24px;}
    .card{max-width:720px;width:100%;background:var(--panel);border:1px solid var(--stroke);border-radius:16px;padding:28px;text-align:center;}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:1px solid #00000025;background:var(--brand);color:#111;font-weight:800;text-decoration:none;}
    .btn-secondary{background:transparent;color:var(--text);border:1px solid var(--stroke);}
    a{color:inherit;text-decoration:none;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Thanks — your message is on the way!</h1>
      <p class="muted">I usually respond the same day. If it’s urgent, feel free to call or text.</p>
      <div class="actions">
        <a class="btn" href="tel:+18889299744">Call (888) 929-9744</a>
        <a class="btn" href="sms:+18889299744">Text me</a>
        <a class="btn-secondary" href="https://calendly.com/vincentactual/15min" target="_blank" rel="noopener">Pick a time</a>
        <a class="btn-secondary" href="/">Back to home</a>
      </div>
    </div>
  </div>
</body>
</html>
